name: Fix v4.4.0 Version and What's New
on:
  push:
    paths:
      - '.github/workflows/fix-v440-version-whats-new.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update live version metadata and What's New
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Runtime/display version: this is what Header, Settings, About,
          # Version Integrity and Backup export all use.
          s=s.replace("const APP_VERSION='4.3.59';", "const APP_VERSION='4.4.0';")

          # Keep source comments current where they can appear in diagnostics/source review.
          s=s.replace('/* v4.3.59 — Unified Button Design System */','/* v4.4.0 — Unified Button Design System */')
          s=s.replace('/* v4.3.59 tablet Guided Workflow responsive fix */','/* v4.4.0 tablet Guided Workflow responsive fix */')
          s=s.replace('/* v4.3.59 TEST 9 — Help portrait tablet table containment fix */','/* v4.4.0 — Help portrait tablet table containment fix */')
          s=s.replace('/* v4.3.59 LIVE — one button language across the whole app.','/* v4.4.0 LIVE — one button language across the whole app.')

          # Replace the top What's New introduction while retaining the detailed
          # historical v4.3.58 guide below it.
          old='''<h3 style="margin-top:0">✨ What’s New — v4.3.58 LIVE</h3>\n  <div class="notice">\n    <b>v4.3.58 LIVE adds Advanced Multi-Officer Planning, Future Officer forecasting, focused Session/Season/Type filtering, saved Officer analysis, XP/Inventory integration and direct Releases-to-Planner navigation.</b>\n  </div>'''
          new='''<h3 style="margin-top:0">✨ What’s New — v4.4.0 LIVE</h3>\n  <div class="notice">\n    <b>v4.4.0 LIVE adds the Planning Readiness Dashboard, turning saved future-Officer scenarios into clear Badge, Star and XP readiness percentages with a priority target and suggested next action.</b>\n  </div>\n  <h4>Planning Readiness Dashboard</h4>\n  <ul>\n    <li><b>Badge, Star and XP readiness</b> shown separately for each saved planning scenario.</li>\n    <li><b>Overall readiness</b> is based on the limiting resource, so the weakest area is immediately visible.</li>\n    <li><b>Priority Target</b> highlights the saved scenario that needs the most attention.</li>\n    <li><b>Suggested Next Action</b> identifies whether to prioritise badge equivalents, Star value or XP.</li>\n    <li><b>Open in Planner</b> reloads the saved scenario directly into the existing Future Officer planning controls.</li>\n    <li>The dashboard uses the existing saved Planning Scenario format, so <b>no saved-data migration is required</b>.</li>\n  </ul>'''
          if old not in s:
              raise SystemExit("What's New v4.3.58 intro not found")
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Documentation/version metadata.
          readme=Path('README.md')
          if readme.exists():
              r=readme.read_text(encoding='utf-8')
              r=re.sub(r'^# KoW Companion v[^\\n]+', '# KoW Companion v4.4.0 LIVE', r, count=1, flags=re.M)
              whats='''\n## What's New — v4.4.0 LIVE\n\n- Planning Readiness Dashboard for saved future-Officer scenarios.\n- Separate Badge, Star and XP readiness percentages.\n- Overall readiness based on the limiting resource.\n- Priority Target highlighting the least-ready saved scenario.\n- Suggested Next Action based on the first resource shortfall.\n- Open in Planner shortcut for saved scenarios.\n- No saved-data migration required.\n'''
              if "## What's New — v4.4.0 LIVE" not in r:
                  first=r.find('\n')
                  r=r[:first+1]+whats+r[first+1:]
              readme.write_text(r,encoding='utf-8')

          guide=Path('USER-GUIDE.md')
          if guide.exists():
              g=guide.read_text(encoding='utf-8')
              if 'Planning Readiness Dashboard' not in g:
                  g += '''\n\n## v4.4.0 — Planning Readiness Dashboard\nSaved Planning Scenarios now feed a readiness dashboard showing Badge, Star and XP readiness, overall readiness, a Priority Target and a Suggested Next Action. Use Open in Planner to reload a saved scenario. Existing saved scenarios remain compatible.\n'''
              guide.write_text(g,encoding='utf-8')

          changelog=Path('CHANGELOG.md')
          if changelog.exists():
              c=changelog.read_text(encoding='utf-8')
              entry='''# v4.4.0 LIVE\n- Added Planning Readiness Dashboard for saved future-Officer scenarios.\n- Added Badge, Star and XP readiness percentages and overall limiting-resource readiness.\n- Added Priority Target, Suggested Next Action and Open in Planner.\n- Updated runtime version metadata and What's New content to v4.4.0.\n\n'''
              if not c.startswith('# v4.4.0 LIVE'):
                  c=entry+c
              changelog.write_text(c,encoding='utf-8')
      - name: Commit live corrections
        run: |
          git config user.name "FireStorm"
          git config user.email "roger.angliss@gmail.com"
          git add index.html README.md USER-GUIDE.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix v4.4.0 version metadata and What's New"
            git push
          fi
