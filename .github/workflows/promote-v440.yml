name: Promote v4.4.0 Live
on:
  push:
    paths:
      - '.github/workflows/promote-v440.yml'
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote approved English Test v4.4.0
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/rogerangliss-byte/KoW-Companion-Test/main/index.html -o index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>KoW Companion v4.4.0 TEST</title>','<title>KoW Companion v4.4.0</title>')
          s=s.replace('<body><div id="helpPortraitTestBanner" style="position:sticky;top:0;z-index:9999;background:#8b0000;color:#fff;text-align:center;font-weight:800;padding:6px">ENGLISH TEST VERSION — v4.4.0 TEST 1 — PLANNING READINESS DASHBOARD — NOT LIVE</div>','<body>')
          s=s.replace('<div class="eyebrow">v4.4.0 TEST</div>','<div class="eyebrow">v4.4.0</div>')
          p.write_text(s)
          sw=Path('service-worker.js')
          if sw.exists():
              t=sw.read_text().splitlines()
              if t and t[0].startswith("const CACHE="):
                  t[0]="const CACHE='kow-english-v4.4.0-live';"
              sw.write_text('\n'.join(t)+'\n')
          Path('RELEASE-v4.4.0-LIVE.md').write_text('''# KoW Companion English v4.4.0 LIVE\n\nApproved English Live release.\n\n## New\n- Planning Readiness Dashboard below Future Officer Targets & Saved Scenarios.\n- Uses existing saved Planning Scenario data; no data migration required.\n- Badge, Star and XP readiness percentages for each saved target.\n- Overall readiness uses the limiting resource.\n- Lowest-readiness saved scenario highlighted as the Priority Target.\n- Suggested Next Action based on the first resource shortfall.\n- Open in Planner reloads the existing saved scenario.\n\nPromoted from approved English Test v4.4.0 TEST 1.\n''')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js RELEASE-v4.4.0-LIVE.md
          git commit -m 'Release KoW Companion v4.4.0 LIVE'
          git push
