<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>KoW Companion v3.1</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <div>
    <h1 id="appTitle">KoW Companion</h1>
    <p>Officer Database Manager · v3.1.0</p>
  </div>
</header>

<main>
  <nav class="tabs">
    <button data-view="planner" class="active">Officer Planner</button>
    <button data-view="database">Officer Database</button>
    <button data-view="settings">Settings</button>
  </nav>

  <section id="planner" class="view active">
    <div class="card">
      <h2>Officer Planner</h2>
      <label>Officer</label>
      <select id="officerSelect"></select>
      <div class="grid2">
        <div>
          <label>ORV per Officer Badge</label>
          <input id="plannerOrv" readonly>
        </div>
        <div>
          <label>SRV per Exclusive Star</label>
          <input id="plannerSrv" readonly>
        </div>
      </div>
      <p class="muted">The planner reads directly from the editable Officer Database.</p>
    </div>
  </section>

  <section id="database" class="view">
    <div class="card">
      <div class="toolbar">
        <input id="search" placeholder="Search officers">
        <select id="seasonFilter"><option value="">All seasons</option></select>
        <button id="addRow">Add Officer</button>
        <button id="saveDb">Save Database</button>
        <button id="exportCsv">Export CSV</button>
        <label class="filebtn">Import CSV<input id="importCsv" type="file" accept=".csv,text/csv"></label>
        <button id="restoreDefaults">Restore Defaults</button>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>Officer Name</th>
              <th>Season</th>
              <th>ORV / Badge</th>
              <th>SRV / Exclusive Star</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="officerRows"></tbody>
        </table>
      </div>
      <div id="validation" class="notice"></div>
    </div>
  </section>

  <section id="settings" class="view">
    <div class="card">
      <h2>Settings</h2>
      <label>App Name</label>
      <input id="appName" value="KoW Companion">
      <label>Background Image</label>
      <input id="backgroundPicker" type="file" accept="image/*">
      <button id="resetAppearance">Reset Appearance</button>
      <p class="muted">Appearance settings are stored in this browser.</p>
    </div>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
